name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Backend (Go Fiber v3) ───────────────────────────────────────────────
  backend:
    name: go build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download modules
        working-directory: .
        run: go mod download

      - name: Stub web/dist (so go:embed resolves)
        # go:embed in main.go requires web/dist to exist at compile time.
        run: |
          mkdir -p web/dist
          [ -f web/dist/.keep ] || touch web/dist/.keep

      - name: go vet
        working-directory: .
        run: |
          go version
          ls -la
          go vet ./...

      - name: Build
        run: go build -o /tmp/golify-bin .

      - name: Smoke-test binary (no network)
        run: |
          GOTIFY_HTTP=:18080 GOTIFY_HTTPS=:18443 GOTIFY_FE=:13000 /tmp/golify-bin &
          PID=$!
          # Seed runs many GORM inserts + opens a DB; give it 5s before curling.
          for i in 1 2 3 4 5; do
            sleep 1
            if curl -fsS http://127.0.0.1:18080/api/v1/health 2>/dev/null; then
              echo "\nhealth OK"
              break
            fi
            echo "wait $i..."
          done
          kill $PID || true
          wait $PID 2>/dev/null || true

  # ─── Frontend (Vue 3 + Vite) ─────────────────────────────────────────────
  frontend:
    name: vue build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload FE dist
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist-${{ matrix.node }}
          path: web/dist
          if-no-files-found: error
