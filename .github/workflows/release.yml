name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.25'

jobs:
  build:
    name: Build & package (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - name: linux-386
            goos: linux
            goarch: 386
            ext: ''
          - name: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Stub web/dist (go:embed)
        run: |
          mkdir -p web/dist
          echo '<!doctype html><html><body>placeholder</body></html>' > web/dist/index.html

      - name: Download modules
        run: go mod download

      - name: Build ${{ matrix.name }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          BIN="golify-${{ matrix.name }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "$BIN" .
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: golify-${{ matrix.name }}
          path: golify-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  package:
    name: Package .deb / .rpm / .apk
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: golify-linux-amd64
          path: dist/

      - name: Make binary executable
        run: chmod +x dist/golify-linux-amd64

      - name: Package .deb / .rpm / .apk
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p packages
          nfpm package --config .nfpm.yaml --packager deb --target "packages/golify_${VERSION}_amd64.deb"
          nfpm package --config .nfpm.yaml --packager rpm --target "packages/golify-${VERSION}-1.x86_64.rpm"
          nfpm package --config .nfpm.yaml --packager apk --target "packages/golify_${VERSION}_amd64.apk"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
          if-no-files-found: error

  release:
    name: Generate AI notes & publish release
    runs-on: ubuntu-latest
    needs: [build, package]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changelog (git log since previous tag)
        id: changelog
        run: |
          PREV=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV" ]; then
            LOG=$(git log --pretty=format:'%h %s' --no-merges "$(git rev-list --max-parents=0 HEAD)"..HEAD)
          else
            LOG=$(git log --pretty=format:'%h %s' --no-merges "$PREV"..HEAD)
          fi
          printf '%s' "$LOG" > /tmp/changelog.txt
          echo "PREV_TAG=$PREV" >> "$GITHUB_ENV"

      - name: Generate release notes via AI (9Router)
        id: notes
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -n "$AI_API_KEY" ]; then
            node .github/scripts/release-notes.mjs "${{ github.ref_name }}" "$PREV" "$(cat /tmp/changelog.txt)" "$AI_API_KEY" > /tmp/notes.md
          else
            printf '## What Changed\n\n' > /tmp/notes.md
            cat /tmp/changelog.txt >> /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: release-assets/**
          generate_release_notes: false
